name: Build jar
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Resonance-26.3.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - run: gradle build
        working-directory: Resonance-26.3
      - name: Show built files
        run: find . -name "*.jar" -not -path "*/.gradle/*" -not -path "*/gradle-*" | head -20
      - name: Collect jar
        run: |
          mkdir out
          cp $(find Resonance-26.3/build/libs -name "*.jar" -not -name "*-sources*" -not -name "*-dev*" | head -1) out/Resonance-1.1.0-mc26.3.jar
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-jar${{ github.run_number }}
          files: out/Resonance-1.1.0-mc26.3.jar
          fail_on_unmatched_files: true
