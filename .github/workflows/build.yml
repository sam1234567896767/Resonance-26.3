name: Build jar
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Resonance-26.3.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - run: gradle build --no-daemon
        working-directory: Resonance-26.3
      - name: Collect jar
        run: |
          echo "--- all jars in the project:"
          find "$GITHUB_WORKSPACE" -name "*.jar" -not -path "*/.gradle/*" -not -path "*/gradle-*" -not -path "*/.git/*"
          echo "--- build folder:"
          ls -R Resonance-26.3/build | head -60
          mkdir -p out
          JAR=$(find "$GITHUB_WORKSPACE/Resonance-26.3" -name "*.jar" -not -path "*/.gradle/*" -not -name "*-sources*" -not -name "*-dev*" | head -1)
          echo "chosen: $JAR"
          test -n "$JAR"
          cp "$JAR" out/Resonance-1.1.0-mc26.3.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-jar${{ github.run_number }}
          files: out/Resonance-1.1.0-mc26.3.jar
          fail_on_unmatched_files: true
